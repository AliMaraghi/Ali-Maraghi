name: apex-gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly, code-only - no real data, no secrets. See deploy/user/apex-nightly.*
    # for the SEPARATE, owner-machine-only layer that runs against real data.
    - cron: '0 4 * * *'

jobs:
  data-boundary:
    runs-on: ubuntu-latest
    # Runs before every other job (see `needs:` below). Fails fast - no test job
    # runs if this fails. Same forbidden-path list as .git/hooks/pre-commit and
    # docs/DATA_BOUNDARY.md; kept here as a literal list, not sourced from the
    # hook script, so this check does not depend on the hook being installed.
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to run if a forbidden real-data path exists in the checkout
        run: |
          PATTERNS=(
            'runtime/inbox/'
            'runtime/rules/'
            '*.sqlite3'
            '*.db'
            '*.db-journal'
            '.env'
            '.env.*'
            'secrets/'
            'user_data/'
            'Owner_Handoff_*.log'
            'biometrics/'
          )
          violation=""
          for pattern in "${PATTERNS[@]}"; do
            match=$(find . -path ./.git -prune -o -path "*${pattern}*" -print 2>/dev/null | head -1)
            if [ -n "$match" ]; then
              violation="$match"
              break
            fi
          done
          if [ -n "$violation" ]; then
            echo "DATA_BOUNDARY_VIOLATION: $violation. Real data cannot enter this repo."
            echo "See docs/DATA_BOUNDARY.md."
            exit 1
          fi
          echo "OK: no forbidden real-data path found in the checkout"

  gates:
    needs: data-boundary
    runs-on: ubuntu-latest
    # No secrets are declared or referenced anywhere in this workflow. If a future
    # change needs one, that change is wrong - remove it instead (brutal-honesty
    # directive, 2026-11-15, Layer 2 hard boundary).
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to run if runtime/ exists in the checkout (hard fail, not a warning)
        run: |
          if [ -d runtime ]; then
            echo "HARD FAIL: runtime/ exists in this checkout - refusing to run (data-leak boundary)"
            exit 1
          fi
          echo "OK: runtime/ does not exist in this checkout"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install cryptography

      - name: Full offline test suite
        run: PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/test_offline.py

      - name: Sandbox tests (Phase F)
        run: PYTHONPATH=core PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest tests.test_sandbox -v

      - name: Isolation / tiering / capability-token tests
        run: |
          PYTHONPATH=core PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest \
            tests.test_tiering tests.test_capability_tokens tests.test_persona tests.test_dpif_v1 -v

      - name: Gate check (always_allow, synthetic disclosure, kill switch - hard fail on regression)
        run: PYTHONDONTWRITEBYTECODE=1 python3 -B .github/scripts/gate_check.py
