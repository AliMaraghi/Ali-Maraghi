services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MAX_CALLS_PER_DAY=${MAX_CALLS_PER_DAY:-100}
      - BUDGET_COUNTER_PATH=/data/call_counter.json
    volumes:
      - tool_data:/data

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  tool_data:
