# systemd drop-in: switch a service to the local Ollama model (VPS, no Docker).
# Install as /etc/systemd/system/apex-voice.service.d/local-llm.conf and
# /etc/systemd/system/apex-agents.service.d/local-llm.conf, then daemon-reload and restart.
[Service]
Environment=APEX_LLM_PROVIDER=ollama
Environment=APEX_OLLAMA_URL=http://127.0.0.1:11434
Environment=APEX_OLLAMA_MODEL=gemma3:4b
Environment=APEX_OLLAMA_EMBED=bge-m3
Environment=APEX_OLLAMA_NUM_CTX=8192
